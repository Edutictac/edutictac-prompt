# Acceso corto: conserva el origen de la PWA y su biblioteca IndexedDB.
server {
    listen 80;
    listen [::]:80;
    server_name prompt.edutictac.es;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://prompt.edutictac.es$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name prompt.edutictac.es;
    ssl_certificate /etc/letsencrypt/live/prompt.edutictac.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompt.edutictac.es/privkey.pem;
    location / { return 302 https://pages.edutictac.es/Edutictac/edutictac-prompt$request_uri; }
}
